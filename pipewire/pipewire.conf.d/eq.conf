# Simpan sebagai: ~/.config/pipewire/pipewire.conf.d/eq.conf
# Membuat sink virtual "Equalizer" berisi 10 band (filter bawaan PipeWire, tanpa plugin tambahan)
context.modules = [
  { name = libpipewire-module-filter-chain
    args = {
      node.description = "Equalizer"
      media.name = "Equalizer"
      filter.graph = {
        nodes = [
          { type = builtin  name = eq_band_1  label = bq_peaking  control = { "Freq" = 31  "Q" = 1.0  "Gain" = 0.0 } }
          { type = builtin  name = eq_band_2  label = bq_peaking  control = { "Freq" = 62  "Q" = 1.0  "Gain" = 0.0 } }
          { type = builtin  name = eq_band_3  label = bq_peaking  control = { "Freq" = 125  "Q" = 1.0  "Gain" = 0.0 } }
          { type = builtin  name = eq_band_4  label = bq_peaking  control = { "Freq" = 250  "Q" = 1.0  "Gain" = 0.0 } }
          { type = builtin  name = eq_band_5  label = bq_peaking  control = { "Freq" = 500  "Q" = 1.0  "Gain" = 0.0 } }
          { type = builtin  name = eq_band_6  label = bq_peaking  control = { "Freq" = 1000  "Q" = 1.0  "Gain" = 0.0 } }
          { type = builtin  name = eq_band_7  label = bq_peaking  control = { "Freq" = 2000  "Q" = 1.0  "Gain" = 0.0 } }
          { type = builtin  name = eq_band_8  label = bq_peaking  control = { "Freq" = 4000  "Q" = 1.0  "Gain" = 0.0 } }
          { type = builtin  name = eq_band_9  label = bq_peaking  control = { "Freq" = 8000  "Q" = 1.0  "Gain" = 0.0 } }
          { type = builtin  name = eq_band_10  label = bq_peaking  control = { "Freq" = 16000  "Q" = 1.0  "Gain" = 0.0 } }
        ]
        links = [
          { output = "eq_band_1:Out"  input = "eq_band_2:In" }
          { output = "eq_band_2:Out"  input = "eq_band_3:In" }
          { output = "eq_band_3:Out"  input = "eq_band_4:In" }
          { output = "eq_band_4:Out"  input = "eq_band_5:In" }
          { output = "eq_band_5:Out"  input = "eq_band_6:In" }
          { output = "eq_band_6:Out"  input = "eq_band_7:In" }
          { output = "eq_band_7:Out"  input = "eq_band_8:In" }
          { output = "eq_band_8:Out"  input = "eq_band_9:In" }
          { output = "eq_band_9:Out"  input = "eq_band_10:In" }
        ]
      }
      capture.props = {
        node.name = "effect_input.eq"
        media.class = Audio/Sink
        audio.channels = 2
        audio.position = [ FL FR ]
      }
      playback.props = {
        node.name = "effect_output.eq"
        node.passive = true
        audio.channels = 2
        audio.position = [ FL FR ]
      }
    }
  }
]
