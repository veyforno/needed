; theme.conf
; Settings you can change WITHOUT touching the QML code.
; In Main.qml they are read as config.<name>, e.g. config.background

[General]
; Background, relative to the theme folder. The file extension decides the type:
;   image : assets/background.png  (or .jpg)
;   GIF   : assets/background.gif
;   video : assets/background.mp4  (or .webm)  -> loops, muted
background=assets/wallpaper3.mp4

; Font used for everything (must be installed on your system)
fontFamily=Open Sans

; Main text color (clock, date, labels)
textColor=#ffffff

; Color of dim things (Login button when empty, session label)
dimColor=#8a8a8a

; Color of the error message when the password is wrong
errorColor=#ff5555

; Horizontal position of the login column, as a fraction of screen width.
; 0.10 = near the left edge like the screenshot, 0.5 = center.
columnPosition=0.10
